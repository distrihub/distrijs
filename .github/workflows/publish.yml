name: Publish Packages

# Publishes @distri/core, @distri/state, @distri/react and @distri/react-native
# to npm when a tag v<version> is pushed. The tag's commit must have all four
# package.json files at <version>; the build and tests run before anything is
# published. A version with a prerelease part (0.5.0-rc.1) goes to the npm
# dist-tag `next`, any other to `latest`. A package already on npm at
# <version> is skipped, so a re-run after a partial failure finishes the rest.
#
# Pushed by distri-cloud's `canopy run release-distrijs -- <version>`
# (scripts/release/distrijs.sh there). workflow_dispatch is a dry run on any
# ref: build, test, pack and `npm publish --dry-run`.
#
# Auth: npm trusted publishing (OIDC) when the package names this repository
# and publish.yml as its trusted publisher on npmjs.com; otherwise the
# NPM_TOKEN secret. Either way npm records provenance.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # trusted publishing and provenance

env:
  PACKAGES: core state react react-native

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: npm 11.5.1+ (trusted publishing)
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Version and dist-tag
        id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION=${GITHUB_REF_NAME#v}
            DRY=false
          else
            VERSION=$(node -p "require('./packages/core/package.json').version")
            DRY=true
          fi
          for p in $PACKAGES; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$VERSION" ] || { echo "::error::packages/$p is $v, not $VERSION"; exit 1; }
          done
          case "$VERSION" in *-*) TAG=next ;; *) TAG=latest ;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "@distri $VERSION -> npm dist-tag $TAG (dry run: $DRY)"

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec turbo build --filter=./packages/core --filter=./packages/state --filter=./packages/react --filter=./packages/react-native

      - name: Test
        run: |
          for p in $PACKAGES; do
            echo "::group::packages/$p"
            pnpm --filter ./packages/$p test
            echo "::endgroup::"
          done

      - name: Pack
        # `pnpm pack` replaces workspace:* with the version.
        run: |
          mkdir -p packed
          for p in $PACKAGES; do (cd packages/$p && pnpm pack --pack-destination ../../packed); done
          ls -la packed

      - name: Publish
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
          DRY: ${{ steps.v.outputs.dry }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in $PACKAGES; do
            tgz="./packed/distri-$p-$VERSION.tgz"
            if [ "$DRY" = true ]; then
              npm publish "$tgz" --access public --tag "$TAG" --dry-run
            elif NPM_CONFIG_USERCONFIG=/dev/null npm view "@distri/$p@$VERSION" version >/dev/null 2>&1; then
              echo "@distri/$p@$VERSION is already on npm: skipped"
            else
              npm publish "$tgz" --access public --tag "$TAG" --provenance
            fi
          done

      - name: Summary
        run: |
          {
            echo "## @distri ${{ steps.v.outputs.version }} (npm ${{ steps.v.outputs.tag }}, dry run: ${{ steps.v.outputs.dry }})"
            for p in $PACKAGES; do echo "- https://www.npmjs.com/package/@distri/$p/v/${{ steps.v.outputs.version }}"; done
          } >> "$GITHUB_STEP_SUMMARY"
