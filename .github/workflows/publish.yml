name: Publish Packages

# Publishes @distri/core, @distri/state, @distri/react and @distri/react-native
# at the version already in their package.json files (one version for all
# four; bump it in a PR first), after their tests pass. `pnpm publish` turns
# `workspace:*` into that version. With `tag: latest` it also pushes the git
# tag v<version>. Started by distri-cloud's `canopy run release-distrijs`
# (scripts/release/distrijs.sh there), or by hand.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version in the four package.json files (e.g. 0.5.0)'
        required: true
        type: string
      tag:
        description: 'npm dist-tag'
        required: true
        default: 'latest'
        type: choice
        options: [latest, next, beta, alpha]
      dry_run:
        description: 'Dry run: build, test and pack, publish nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  PACKAGES: core state react react-native

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Every package is at the version asked for
        run: |
          for p in $PACKAGES; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "${{ inputs.version }}" ] || { echo "packages/$p is $v, not ${{ inputs.version }}"; exit 1; }
          done

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec turbo build --filter=./packages/core --filter=./packages/state --filter=./packages/react --filter=./packages/react-native

      - name: Test
        run: |
          for p in $PACKAGES; do
            echo "::group::packages/$p"
            pnpm --filter ./packages/$p test
            echo "::endgroup::"
          done

      - name: Pack (what would be published)
        run: |
          mkdir -p packed
          for p in $PACKAGES; do (cd packages/$p && pnpm pack --pack-destination ../../packed); done
          ls -la packed

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in $PACKAGES; do
            (cd packages/$p && pnpm publish --access public --tag "${{ inputs.tag }}" --no-git-checks)
          done

      - name: Tag v<version>
        if: ${{ !inputs.dry_run && inputs.tag == 'latest' }}
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Summary
        run: |
          {
            echo "## @distri ${{ inputs.version }} (${{ inputs.tag }})"
            echo "Dry run: ${{ inputs.dry_run }}"
            for p in $PACKAGES; do echo "- @distri/$p"; done
          } >> "$GITHUB_STEP_SUMMARY"
